name: appimage

# Builds BATMAN-x86_64.AppImage (the desktop app) from the current code,
# launches it headless as a smoke test, and uploads it as a workflow artifact.
# Pushing a tag like v2.1.0 also attaches it to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "packaging/**"
      - ".github/workflows/appimage.yml"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/appimage.yml"

jobs:
  build:
    # Ubuntu 22.04's older glibc means the AppImage runs on more distributions
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # only used to attach the AppImage to a tag's release
    steps:
      - uses: actions/checkout@v4

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Check out Git LFS files
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Qt needs these shared libraries, even offscreen
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the AppImage
        run: bash packaging/build_appimage.sh

      - name: Smoke test (launch headless for 30 s)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 30 ./dist/BATMAN-x86_64.AppImage --appimage-extract-and-run > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          # 124 = still running when the timeout stopped it, i.e. it started fine
          if [ "$status" -ne 124 ] || grep -q "Traceback" smoke.log; then
            echo "The AppImage exited early (status $status) or raised an error"
            exit 1
          fi
          # The desktop data layer prints this when the bundled scores are missing
          if grep -q "No risk scores found" smoke.log; then
            echo "The AppImage started without its bundled risk scores"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BATMAN-x86_64.AppImage
          path: dist/BATMAN-x86_64.AppImage
          retention-days: 30

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "BATMAN desktop app, built from $GITHUB_SHA."
          gh release upload "$GITHUB_REF_NAME" dist/BATMAN-x86_64.AppImage --clobber

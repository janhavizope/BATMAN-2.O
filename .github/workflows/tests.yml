name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # data/elliptic_plus/*.parquet are Git LFS files (~55 MB). Download them
      # once and reuse them from the Actions cache, so each run doesn't spend
      # the repository's Git LFS bandwidth quota.
      - uses: actions/checkout@v4

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore Git LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Check out Git LFS files
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Qt needs these shared libraries even in offscreen mode
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
